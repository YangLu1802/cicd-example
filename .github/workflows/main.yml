name: Code Checks
on: push

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps: 
      - name: Greeting!
        run: echo hello world

  test_python-versions:
    name: Check Python ${{ matrix.python-version }} on Ubuntu
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with: 
          python-version: ${{ matrix.python-version }} # quote ensure not goes to 3.1

      - name: Install package
        run: python -m pip install -e . [test] # specify the optional package that do need to be installed

      - name: Test package
        run: python -m pytest # costumized tool?